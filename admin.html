<!-- ═══ Dark mode pre-init ═══ -->
<script>
(function(){
  var dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  try{
    var stored=localStorage.getItem('learnsy_admin_dark');
    if(stored==='1')dark=true;
    else if(stored==='0')dark=false;
  }catch(e){}
  if(dark){
    document.documentElement.classList.add('dark');
    document.body&&document.body.classList.add('dark');
  }
  if(!document.body){
    document.addEventListener('DOMContentLoaded',function(){
      if(dark)document.body.classList.add('dark');
    },{once:true});
  }
  window.__adminDarkInit=dark;
})();
</script>

<!-- ═══ Samsung WebView / Gboard DOM safety patch ═══ -->
<script>
(function(){
  var _rc=Node.prototype.removeChild;
  Node.prototype.removeChild=function(child){
    if(child&&child.parentNode===this)return _rc.call(this,child);
    return child||null;
  };
  var _ib=Node.prototype.insertBefore;
  Node.prototype.insertBefore=function(node,ref){
    if(!ref)return _ib.call(this,node,null);
    try{return _ib.call(this,node,ref);}catch(e){}
    try{return _ib.call(this,node,null);}catch(e){}
    return node;
  };
})();
</script>

<!-- ═══ Supabase config ═══ -->
<script>
  const CACHE_KEY='lessons_cache';

  async function upstashCmd(...args){
    try{
      const r=await fetch('/api/cache',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(args)});
      return(await r.json()).result;
    }catch(e){return null;}
  }

  // invalidateCache() được định nghĩa trong admin/JS/main.jsx (load bên dưới) —
  // gọi đúng chuẩn POST /api/cache với body ['DEL','lessons_cache'].
  // KHÔNG định nghĩa lại ở đây để tránh 2 bản khác nhau cùng tên gây nhầm lẫn.

  const CF_WORKER_URL='';
  async function cfFetch(path,body){
    const r=await fetch(CF_WORKER_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    return r.json();
  }

  window.__ENC_KEY='cf71184c6108936b852ca4f0fca82fa873bf4ce0f9f26e44afc17edbe6c5ca3f';

  async function _decryptCfg(enc){
    function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
    function h2b(h){return Uint8Array.from({length:h.length>>1},(_,i)=>parseInt(h.slice(i*2,i*2+2),16));}
    const key=await crypto.subtle.importKey(
      'raw',h2b(window.__ENC_KEY),{name:'AES-GCM'},false,['decrypt']);
    const plain=await crypto.subtle.decrypt(
      {name:'AES-GCM',iv:b64(enc.iv),tagLength:128},key,b64(enc.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  window.__configReady=(async()=>{
    try{
      const enc=await fetch('/api/config').then(r=>r.json());
      const cfg=await _decryptCfg(enc);
      window.supa=supabase.createClient(cfg.supaUrl||'',cfg.supaKey||'');
      window.ADMIN_API_KEY=cfg.adminApiKey||''; // rỗng nếu chưa đăng nhập admin
    }catch(e){
      console.error('[config] Lỗi load/giải mã config:',e);
    }
  })();

  /** Sau khi admin đăng nhập: xin lại cấu hình kèm JWT để nhận ADMIN_API_KEY. */
  window.__loadAdminKey=async function(){
    try{
      const {data}=await window.supa.auth.getSession();
      const jwt=data&&data.session&&data.session.access_token;
      if(!jwt)return false;
      const enc=await fetch('/api/config',{headers:{Authorization:'Bearer '+jwt},cache:'no-store'}).then(r=>r.json());
      const cfg=await _decryptCfg(enc);
      window.ADMIN_API_KEY=cfg.adminApiKey||'';
      return !!window.ADMIN_API_KEY;
    }catch(e){console.error('[config] __loadAdminKey:',e);return false;}
  };
</script>
